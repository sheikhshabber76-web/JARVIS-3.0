name: Build JARVIS 3.0 APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get JARVIS Code
        uses: actions/checkout@v4

      - name: Download Telugu Font
        run: |
          mkdir -p fonts
          curl -L --fail -o /tmp/NotoSansTelugu.zip \
            https://github.com/notofonts/telugu/releases/download/NotoSansTelugu-v2.005/NotoSansTelugu-v2.005.zip
          mkdir -p /tmp/noto-font
          unzip -q /tmp/NotoSansTelugu.zip -d /tmp/noto-font
          FONT_PATH="$(find /tmp/noto-font -type f -name 'NotoSansTelugu-Regular.ttf' -print -quit)"
          test -n "$FONT_PATH"
          cp "$FONT_PATH" fonts/NotoSansTelugu-Regular.ttf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Check Project Files
        run: |
          pwd
          ls -la
          echo "Checking main.py"
          test -f main.py && echo "main.py FOUND" || echo "main.py MISSING"
          echo "Checking buildozer.spec"
          test -f buildozer.spec && echo "buildozer.spec FOUND" || echo "buildozer.spec MISSING"

      - name: Build Android APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-3.0-APK
          path: bin/*.apk
          if-no-files-found: error
